name: Build and Deploy Colorimeter - dev

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '20[1-9][0-9]_R[1-9]'
      - staging/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - '20[1-9][0-9]_R[1-9]'

env:
  CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
  STAGE: dev

jobs:
  identify-version:
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.set_version.outputs.version }}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@v6
    - name: Set app version
      id: set_version
      run: |
        .github/scripts/identify-version.sh
  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: identify-version
    env:
      ARTIFACT_NAME: Debian-13-arm64.deb
      CMAKE_OPTIONS: '-DPYTHON_BINDINGS=ON -DENABLE_PACKAGING=ON -DDEB_DETECT_DEPENDENCIES=ON'
      LD_LIBRARY_PATH: /usr/local/lib
      ARCHITECTURE: arm64
    container:
      image: debian:trixie
    steps:
    - name: Checkout code repository
      uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        .github/scripts/install-deps.sh
    - name: Create debian package
      run: |
        .github/scripts/create_debian.sh ${{needs.identify-version.outputs.app-version}}
    - name: Install application
      run: |
        (apt-get install -y policykit-1 || apt-get install -y polkitd pkexec) && \
        apt-get install -y python3-gi-cairo && \
        dpkg -i ../colorimeter_${{needs.identify-version.outputs.app-version}}-1_arm64.deb
    - name: Verify install locations
      run: |
        .github/scripts/verify_install.sh
    - name: Copy debian artifacts
      run: |
        mkdir -p artifacts
        cp ../*.deb ../*.dsc ../*.debian.tar.xz ../*.orig.tar.gz artifacts/
    - name: Upload debian artifacts to github
      uses: actions/upload-artifact@v7
      with:
        name: colorimeter-debian13-arm64
        path: |
          artifacts/
        if-no-files-found: error
  build-armhf:
    runs-on: ubuntu-24.04-arm
    needs: identify-version
    env:
      ARTIFACT_NAME: Debian-13-armhf.deb
      CMAKE_OPTIONS: '-DPYTHON_BINDINGS=ON -DENABLE_PACKAGING=ON -DDEB_DETECT_DEPENDENCIES=ON'
      LD_LIBRARY_PATH: /usr/local/lib
      ARCHITECTURE: armhf
    steps:
    - name: Checkout code repository
      uses: actions/checkout@v7
    - name: Build in docker
      run: |
        docker run --platform linux/arm/v7 --name debian13-armhf \
          -v "${{ github.workspace }}:/workspace/colorimeter" \
          -e ARTIFACT_NAME="Debian-13-armhf.deb" \
          -e ARCHITECTURE="armhf" \
          -e CLOUDSMITH_API_KEY="$CLOUDSMITH_API_KEY" \
          -e STAGE="$STAGE" \
          arm32v7/debian:trixie \
          /bin/bash -c "
            set -e
            cd /workspace/colorimeter
            .github/scripts/install-deps.sh
            .github/scripts/create_debian.sh ${{needs.identify-version.outputs.app-version}}
            (apt-get install -y policykit-1 || apt-get install -y polkitd pkexec)
            apt-get install -y python3-gi-cairo
            dpkg -i ../colorimeter_${{needs.identify-version.outputs.app-version}}-1_armhf.deb
            .github/scripts/verify_install.sh
          "
    - name: Copy debian artifacts
      run: |
        mkdir -p artifacts
        docker cp debian13-armhf:/workspace/. ./artifacts/
        docker rm debian13-armhf
    - name: Upload debian artifacts to github
      uses: actions/upload-artifact@v7
      with:
        name: colorimeter-debian13-armhf
        path: |
          artifacts/
        if-no-files-found: error
  build-ubuntu:
    runs-on: ubuntu-latest
    needs: identify-version
    env:
      ARCHITECTURE: amd64
      ARTIFACT_NAME: Linux-Ubuntu-24.04.deb
      CMAKE_OPTIONS: '-DPYTHON_BINDINGS=ON -DENABLE_PACKAGING=ON -DDEB_DETECT_DEPENDENCIES=ON'
      LD_LIBRARY_PATH: /usr/local/lib
    steps:
    - name: Checkout code repository
      uses: actions/checkout@v6
    - name: Install dependencies
      shell: sh
      run: |
        .github/scripts/install-deps.sh
    - name: Create .deb package
      run: |
        .github/scripts/create_debian.sh ${{needs.identify-version.outputs.app-version}}
      env:
        PYTHON: /usr/bin/python3
    - name: Install application
      run: |
        sudo apt-get install -y policykit-1 python3-gi-cairo
        sudo dpkg -i ../colorimeter_${{needs.identify-version.outputs.app-version}}-1_${{env.ARCHITECTURE}}.deb
    - name: Verify install locations
      run: |
        .github/scripts/verify_install.sh
      env:
        PYTHON: /usr/bin/python3
    - name: Copy debian artifacts
      run: |
        mkdir -p artifacts
        cp ../*.deb ../*.dsc ../*.debian.tar.xz ../*.orig.tar.gz artifacts/
    - name: Upload debian artifacts to github
      uses: actions/upload-artifact@v7
      with:
        name: colorimeter-ubuntu_dev
        path: |
          artifacts/
        if-no-files-found: error
