name: Build and Deploy Colorimeter

permissions:
  contents: read

env:
  APP_NAME: colorimeter

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '20[1-9][0-9]_R[1-9]'
      - staging/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - '20[1-9][0-9]_R[1-9]'

jobs:
  identify_version:
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.set_version.outputs.version }}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@v4
    - name: Set app version
      id: set_version
      run: |
        # Extract version from setup.py
        setup_version=$(grep -oP "version\s*=\s*['\"]\\K[0-9]+\\.[0-9]+(\\.[0-9]+)?" setup.py)

        if [[ -z "$setup_version" ]]; then
            echo "Failed to extract version from setup.py, using default"
            setup_version="0.0.1+${{ github.sha }}"
        fi

        echo "Version to use: $setup_version"
        echo "version=$setup_version" >> "$GITHUB_OUTPUT"

  build_arm_native:
    runs-on: ubuntu-24.04-arm
    needs: identify_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker_image: aandrisa/kuiper_basic_64:latest
            distro: kuiper
            architecture: arm64
            platform_flag: ""
          - docker_image: arm64v8/debian:trixie
            distro: debian13
            architecture: arm64
            platform_flag: ""
          - docker_image: aandrisa/kuiper_basic_32:latest
            distro: kuiper
            architecture: armhf
            platform_flag: "--platform linux/arm/v7"
          - docker_image: arm32v7/debian:trixie
            distro: debian13
            architecture: armhf
            platform_flag: "--platform linux/arm/v7"

    steps:
    - name: Checkout code repository
      uses: actions/checkout@v4
      with:
        path: ${{env.APP_NAME}}

    - name: Start persistent container
      run: |
        docker run -d \
            ${{matrix.platform_flag}} \
            --name ${{matrix.distro}}-${{matrix.architecture}} \
            -v "$GITHUB_WORKSPACE/${{env.APP_NAME}}:/workspace/${{env.APP_NAME}}" \
            -w /workspace/${{env.APP_NAME}} \
            ${{matrix.docker_image}} tail -f /dev/null

    - name: Create debian package
      run: |
        docker exec ${{matrix.distro}}-${{matrix.architecture}} sh -c ".github/scripts/create_debian.sh ${{needs.identify_version.outputs.app-version}}"

    - name: Install application
      run: |
        docker exec ${{matrix.distro}}-${{matrix.architecture}} sh -c "(apt-get install -y policykit-1 || apt-get install -y polkitd pkexec) && apt-get install -y python3-gi-cairo && dpkg -i ../${{env.APP_NAME}}_${{needs.identify_version.outputs.app-version}}-1_${{matrix.architecture}}.deb"

    - name: Verify install locations
      run: |
        docker exec ${{matrix.distro}}-${{matrix.architecture}} sh -c ".github/scripts/verify_install.sh"

    - name: Copy debian artifacts from container to host
      run: |
        docker cp ${{matrix.distro}}-${{matrix.architecture}}:/workspace/. ./artifacts/
        ls -la ./artifacts/

    - name: Upload debian artifacts to github
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.APP_NAME}}-${{matrix.distro}}-${{matrix.architecture}}
        path: |
          artifacts/*.deb
          artifacts/*.dsc
          artifacts/*.debian.tar.xz
          artifacts/*.orig.tar.gz
        if-no-files-found: error

  build_ubuntu:
    runs-on: ubuntu-latest
    needs: identify_version
    env:
      architecture: amd64
    defaults:
      run:
        working-directory: ${{env.APP_NAME}}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@v4
      with:
        path: ${{env.APP_NAME}}

    - name: Create .deb package
      run: |
        .github/scripts/create_debian.sh ${{needs.identify_version.outputs.app-version}}

    - name: Install application
      run: |
        sudo apt-get install -y policykit-1 python3-gi-cairo
        sudo dpkg -i ../${{env.APP_NAME}}_${{needs.identify_version.outputs.app-version}}-1_${{env.architecture}}.deb

    - name: Verify install locations
      run: |
        .github/scripts/verify_install.sh

    - name: Copy debian artifacts
      run: |
        mkdir -p artifacts
        cp ../*.deb ../*.dsc ../*.debian.tar.xz ../*.orig.tar.gz artifacts/
        ls -la artifacts/

    - name: Upload debian artifacts to github
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.APP_NAME}}-ubuntu
        path: |
          ${{env.APP_NAME}}/artifacts/*.deb
          ${{env.APP_NAME}}/artifacts/*.dsc
          ${{env.APP_NAME}}/artifacts/*.debian.tar.xz
          ${{env.APP_NAME}}/artifacts/*.orig.tar.gz
        if-no-files-found: error
